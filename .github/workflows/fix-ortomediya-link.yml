name: Fix Ortomediya link
on:
  push:
    paths:
      - '.github/workflows/fix-ortomediya-link.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://ortomediya.отзыв.com'
          new = 'https://yumis84.github.io/ortomediya/'
          if old not in s:
              raise SystemExit('Old Ortomediya link not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Ortomediya profile link' || exit 0
          git push
