name: Fix mobile hero buttons
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-buttons.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix button box sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '<style>*{box-sizing:border-box}' not in s:
              s = s.replace('<style>body{', '<style>*{box-sizing:border-box}body{', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile hero button overflow' || exit 0
          git push
